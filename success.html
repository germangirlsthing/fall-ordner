<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Zahlung erfolgreich – Fall-Ordner Pro</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#F4F6F5;font-family:'IBM Plex Sans',sans-serif;color:#1C2624;text-align:center;}
  .box{max-width:420px;padding:32px;}
  h1{font-family:'Fraunces',serif;font-size:24px;color:#14304A;margin:0 0 12px;}
  p{color:#4B5A57;font-size:14.5px;line-height:1.6;}
  .check{font-size:40px;margin-bottom:8px;}
</style>
</head>
<body>
  <div class="box">
    <div class="check">✅</div>
    <h1>Danke für dein Abo!</h1>
    <p id="msg">Deine Pro-Funktion wird freigeschaltet …</p>
  </div>
  <script>
    // Einfache, clientseitige Freischaltung — kein Server nötig.
    // Hinweis: Das ist eine bewusst simple MVP-Lösung, kein manipulationssicherer Zahlungsabgleich.
    try {
      localStorage.setItem("fallordner_pro_v1", "true");
      document.getElementById("msg").textContent = "Freigeschaltet! Du wirst gleich weitergeleitet …";
    } catch (e) {
      document.getElementById("msg").textContent = "Freischaltung fehlgeschlagen. Bitte kontaktiere uns.";
    }
    setTimeout(() => { window.location.href = "index.html"; }, 2000);
  </script>
</body>
</html>
